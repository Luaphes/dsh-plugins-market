name: star snapshots

# Daily star-count snapshot of the whole dsh-plugin topic, committed into
# snapshots/YYYY-MM-DD.json. The market plugin reads these files to compute
# weekly star deltas (delta needs 7 accumulated days before the weekly sort
# becomes meaningful).
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: crawl topic star snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request
          from urllib.error import HTTPError

          def fetch(page):
              url = f'https://api.github.com/search/repositories?q=topic:dsh-plugin&sort=stars&order=desc&per_page=100&page={page}'
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'dsh-plugins-market-snap',
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          today = time.strftime('%Y-%m-%d')
          repos = {}
          page = 1
          per_page = 100
          while page * per_page <= 1000:
              try:
                  d = fetch(page)
              except HTTPError:
                  break
              for r in d.get('items', []):
                  repos[str(r['id'])] = {
                      'full_name': r['full_name'],
                      'stars': r['stargazers_count'],
                      'date': today,
                  }
              if len(repos) >= d.get('total_count', 0) or not d.get('items'):
                  break
              page += 1
              time.sleep(3)

          os.makedirs('snapshots', exist_ok=True)
          path = f"snapshots/{today}.json"
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(repos, f, ensure_ascii=False, indent=1)
          print(f'snapshot {path}: {len(repos)} repos')
          EOF
      - name: commit snapshot
        run: |
          git config user.name "dsh-market-snapshot-bot"
          git config user.email "dsh-market-snapshot-bot@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet || git commit -m "chore: daily star snapshot $(date +%F)"
          git push
